<script>(function readerMain(){
  var d=document,root=d.documentElement,B=d.body;
  var secs=[].slice.call(d.querySelectorAll('section.ch'));
  if(!secs.length)return;
  var mode=B.getAttribute('data-mode'),paged=mode==='paged',book=mode==='book';
  var KEY='htmlbook:'+d.title+':'+secs.length;
  var st={};
  try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){st={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  var def={fs:+B.getAttribute('data-fs0')||19,lh:'1.85',theme:B.getAttribute('data-theme0')||'auto',font:B.getAttribute('data-font')||'serif',width:'normal',orient:B.getAttribute('data-orient')||'portrait'};
  function get(k){return st[k]!=null?st[k]:def[k];}
  var onPrefs=function(){};
  function applyPrefs(){
    root.style.setProperty('--fs',get('fs')+'px');
    root.style.setProperty('--lh',String(get('lh')));
    var t=get('theme');if(t==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
    root.setAttribute('data-font',get('font'));root.setAttribute('data-width',get('width'));
    [].forEach.call(d.querySelectorAll('[data-set]'),function(b){var p=b.getAttribute('data-set').split(':');b.setAttribute('aria-pressed',String(String(get(p[0]))===p[1]));});
    var o=d.getElementById('rb-fsv');if(o)o.textContent=get('fs');
    onPrefs();
  }
  var tocLinks=[].slice.call(d.querySelectorAll('.rb-toc a'));
  tocLinks.forEach(function(a){var id=decodeURIComponent(a.getAttribute('href').slice(1));var el=d.getElementById(id);var s=el&&el.closest('section.ch');a._sec=s?secs.indexOf(s):-1;});
  var cur=0,label=d.getElementById('rb-where'),prog=d.getElementById('rb-prog'),prevB=d.getElementById('rb-prev'),nextB=d.getElementById('rb-next'),scrim=d.getElementById('rb-scrim');
  function barH(){var b=d.querySelector('.rb-bar');return b?b.offsetHeight+8:0;}
  function maxY(){return Math.max(1,root.scrollHeight-innerHeight);}
  function markToc(){var best=null;tocLinks.forEach(function(a){a.removeAttribute('aria-current');if(a._sec===cur&&!best)best=a;});if(best)best.setAttribute('aria-current','true');}
  function closeAll(){['rb-drawer','rb-set','rb-find'].forEach(function(id){var p=d.getElementById(id);if(p)p.hidden=true;});if(scrim)scrim.hidden=true;}
  function openP(id){closeAll();var p=d.getElementById(id);if(!p)return;p.hidden=false;if(scrim)scrim.hidden=false;if(id==='rb-find'){var q=d.getElementById('rb-q');if(q)q.focus();}var c=p.querySelector('[aria-current]');if(c)c.scrollIntoView({block:'center'});}
  function clearMarks(){[].forEach.call(d.querySelectorAll('mark.rb-m'),function(m){var p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();});}
  function markIn(si,off,len){
    var w=d.createTreeWalker(secs[si],NodeFilter.SHOW_TEXT),pos=0,node;
    while((node=w.nextNode())){var l=node.nodeValue.length;if(pos+l>off){var s0=off-pos,r=d.createRange();r.setStart(node,s0);r.setEnd(node,Math.min(l,s0+len));var m=d.createElement('mark');m.className='rb-m';try{r.surroundContents(m);return m;}catch(e){return node.parentNode;}}pos+=l;}
    return null;
  }

  /* ---------- 捲動與分章模式 ---------- */
  var nav;
  if(!book){
    var progress=function(){var f=Math.min(1,scrollY/maxY());var p=paged?(cur+f)/secs.length:f;if(prog)prog.style.width=(p*100).toFixed(2)+'%';};
    var updateNav=function(){if(label)label.textContent=secs[cur].getAttribute('data-title')||'';if(prevB)prevB.disabled=cur<=0;if(nextB)nextB.disabled=cur>=secs.length-1;};
    var show=function(i,noTop){i=Math.max(0,Math.min(secs.length-1,i|0));cur=i;if(paged){secs.forEach(function(s,j){s.hidden=j!==i;});if(!noTop)scrollTo(0,0);}markToc();updateNav();st.ch=i;save();progress();};
    var goTo=function(id){var el=d.getElementById(id);if(!el)return;var s=el.closest('section.ch');var i=secs.indexOf(s);if(i<0)return;show(i,true);closeAll();requestAnimationFrame(function(){var top=el===s?(paged?0:s.getBoundingClientRect().top+scrollY-barH()):el.getBoundingClientRect().top+scrollY-barH();scrollTo(0,Math.max(0,top));progress();});};
    nav={
      goTo:goTo,
      step:function(n){show(cur+n);},
      hit:function(si,off,len){clearMarks();show(si,true);closeAll();var el=markIn(si,off,len);if(el)requestAnimationFrame(function(){var top=el.getBoundingClientRect().top+scrollY-innerHeight/3;scrollTo(0,Math.max(0,top));progress();});},
      init:function(){var y0=st.y;show(st.ch!=null?st.ch:0,true);if(y0)requestAnimationFrame(function(){scrollTo(0,y0*maxY());progress();});}
    };
    var tmr;
    addEventListener('scroll',function(){
      if(!paged){var y=barH()+innerHeight*0.3,idx=0;for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<=y)idx=i;else break;}if(idx!==cur){cur=idx;markToc();updateNav();}}
      progress();clearTimeout(tmr);tmr=setTimeout(function(){st.ch=cur;st.y=scrollY/maxY();save();},300);
    },{passive:true});
  }

  /* ---------- 翻頁書模式 ---------- */
  if(book){
    var wrap=d.createElement('div');wrap.className='bk';
    var stage=d.createElement('div');stage.className='bk-stage';wrap.appendChild(stage);
    B.insertBefore(wrap,d.querySelector('.rb-pager'));
    var mk=function(cls){var s=d.createElement('div');s.className='bk-sheet '+cls;s.innerHTML='<div class="bk-clip"><div class="bk-flow"></div></div><div class="bk-folio"></div>';return s;};
    var base=mk('bk-base'),meas=mk('bk-meas'),shade=d.createElement('div'),leaf=d.createElement('div'),front=mk('bk-front'),back=d.createElement('div');
    shade.className='bk-shade';leaf.className='bk-leaf';back.className='bk-back';leaf.hidden=true;
    leaf.appendChild(front);leaf.appendChild(back);
    stage.appendChild(meas);stage.appendChild(base);stage.appendChild(shade);stage.appendChild(leaf);
    var dims={step:1},counts=[],pg=0,busy=false,gen=0,endTimer=null;
    var flowOf=function(s){return s.querySelector('.bk-flow');};
    var fill=function(s,ci){if(s._ci===ci)return;var f=flowOf(s);f.innerHTML=secs[ci].innerHTML+'<span class="bk-end"></span>';[].forEach.call(f.querySelectorAll('img[loading]'),function(im){im.removeAttribute('loading');});s._ci=ci;s.classList.toggle('is-cover',secs[ci].classList.contains('cover'));};
    var pageOfEl=function(s,el){var fr=flowOf(s).getBoundingClientRect(),r=el.getBoundingClientRect();return Math.max(0,Math.floor((r.left-fr.left+1)/dims.step));};
    var countOf=function(s){var f=flowOf(s);f.style.transform='none';return pageOfEl(s,f.querySelector('.bk-end'))+1;};
    var ensure=function(ci){if(counts[ci]==null){fill(meas,ci);counts[ci]=countOf(meas);}return counts[ci];};
    var allKnown=function(){for(var i=0;i<secs.length;i++)if(counts[i]==null)return false;return true;};
    var before=function(ci){var s=0;for(var i=0;i<ci;i++)s+=counts[i];return s;};
    var folio=function(){return '';};
    var setPage=function(s,ci,p){fill(s,ci);flowOf(s).style.transform='translateX('+(-p*dims.step)+'px)';s.querySelector('.bk-folio').textContent=folio(ci,p);};
    var update=function(){
      var n=counts[cur]||1,known=allKnown();
      if(label)label.textContent=secs[cur].getAttribute('data-title')||'';
      if(prevB)prevB.disabled=cur<=0&&pg<=0;
      if(nextB)nextB.disabled=cur>=secs.length-1&&pg>=n-1;
      var f=known?(before(cur)+pg+1)/before(secs.length):(cur+(pg+1)/n)/secs.length;
      if(prog)prog.style.width=(f*100).toFixed(2)+'%';
      markToc();st.ch=cur;st.pf=n>1?pg/n:0;save();
    };
    var commit=function(ci,p){cur=ci;pg=p;update();};
    var layout=function(){
      var bar=d.querySelector('.rb-bar'),pager=d.querySelector('.rb-pager');
      wrap.style.top=(bar?bar.offsetHeight:0)+'px';wrap.style.bottom=(pager?pager.offsetHeight:0)+'px';
      var aw=wrap.clientWidth,ah=wrap.clientHeight,m=aw<560?10:22;
      var o=get('orient');if(o==='auto')o=aw>ah*1.15?'landscape':'portrait';
      var land=o==='landscape',W,H,imgBook=B.getAttribute('data-img')==='1';
      if(imgBook){
        var ar=+B.getAttribute('data-ar')||0.707;m=aw<560?4:12;
        H=ah-m*2;W=Math.round(H*ar);
        if(W>aw-m*2-8){W=aw-m*2-8;H=Math.round(W/ar);}
        land=ar>1;stage.classList.toggle('is-land',land);stage.classList.add('is-img');
        var S1=stage.style,pad=2;dims.step=W-pad*2+pad*4;
        S1.setProperty('--clipw',(W-pad*2)+'px');S1.setProperty('--W',W+'px');S1.setProperty('--H',H+'px');S1.setProperty('--px',pad+'px');S1.setProperty('--pt',pad+'px');S1.setProperty('--pb',pad+'px');S1.setProperty('--cw',(W-pad*2)+'px');S1.setProperty('--gap',(pad*4)+'px');S1.setProperty('--chh',(H-pad*2)+'px');
        stage.classList.remove('is-two');return;
      }
      if(land){if(ah<520)m=8;H=Math.max(180,ah-m*2);W=Math.max(260,Math.min(aw-m*2-8,Math.round(H*1.6)));H=Math.min(H,Math.round(W/1.3));}
      else{H=Math.max(260,ah-m*2);W=Math.max(240,Math.min(aw-m*2-8,Math.round(H*0.72)));}
      stage.classList.toggle('is-land',land);
      var px=Math.round(Math.max(16,Math.min(56,(land?H:W)*0.085))),pt=Math.round(Math.max(16,Math.min(50,H*0.06))),pb=pt;
      var clipW=W-px*2,fsPx=parseFloat(getComputedStyle(B).fontSize)||19;
      var two=land&&B.getAttribute('data-img')!=='1'&&clipW>=fsPx*26;
      var cw,gap;
      if(two){gap=Math.round(Math.max(24,px*1.2));cw=Math.floor((clipW-gap)/2);dims.step=2*(cw+gap);}
      else{cw=clipW;gap=px*2;dims.step=cw+gap;}
      stage.classList.toggle('is-two',two);
      var S=stage.style;S.setProperty('--clipw',clipW+'px');S.setProperty('--W',W+'px');S.setProperty('--H',H+'px');S.setProperty('--px',px+'px');S.setProperty('--pt',pt+'px');S.setProperty('--pb',pb+'px');S.setProperty('--cw',cw+'px');S.setProperty('--gap',gap+'px');S.setProperty('--chh',(H-pt-pb)+'px');
    };
    var bg=function(){
      var g=++gen,i=0;
      (function next(){
        if(g!==gen)return;
        while(i<secs.length&&counts[i]!=null)i++;
        if(i>=secs.length){setPage(base,cur,pg);update();return;}
        fill(meas,i);
        var imgs=[].slice.call(flowOf(meas).querySelectorAll('img'));
        Promise.race([Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):null;})),new Promise(function(r){setTimeout(r,2000);})]).then(function(){
          if(g!==gen)return;
          meas._ci=null;fill(meas,i);
          if(counts[i]==null)counts[i]=countOf(meas);
          i++;setTimeout(next,16);
        });
      })();
    };
    var relayout=function(){
      var frac=counts[cur]>1?pg/counts[cur]:0;
      layout();counts=[];meas._ci=front._ci=null;base._ci=null;
      var n=ensure(cur);pg=Math.min(n-1,Math.round(frac*n));
      setPage(base,cur,pg);update();bg();
    };
    var jump=function(ci,p){var n=ensure(ci);if(p<0||p>=n)p=p<0?n-1:n-1;setPage(base,ci,p);commit(ci,p);};
    var finish=function(){clearTimeout(endTimer);if(!busy)return;busy=false;leaf.classList.remove('anim');leaf.hidden=true;if(leaf._after){leaf._after();leaf._after=null;}};
    var reduce=function(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;};
    var turn=function(dir){
      if(busy)finish();
      var ci=cur,p=pg+dir;
      if(p>=(counts[cur]||1)){if(cur>=secs.length-1)return;ci=cur+1;p=0;}
      else if(p<0){if(cur<=0)return;ci=cur-1;p=ensure(ci)-1;}
      ensure(ci);
      if(reduce()){jump(ci,p);return;}
      busy=true;
      if(dir>0){
        setPage(front,cur,pg);
        leaf.classList.remove('anim');leaf.style.transform='rotateY(0deg)';leaf.hidden=false;
        setPage(base,ci,p);commit(ci,p);
        shade.style.transition='none';shade.style.opacity='1';
        void leaf.offsetWidth;
        shade.style.transition='';shade.style.opacity='0';
        leaf.classList.add('anim');leaf.style.transform='rotateY(-180deg)';
      }else{
        setPage(front,ci,p);
        leaf.classList.remove('anim');leaf.style.transform='rotateY(-180deg)';leaf.hidden=false;
        void leaf.offsetWidth;
        leaf.classList.add('anim');leaf.style.transform='rotateY(0deg)';
        commit(ci,p);
        leaf._after=function(){setPage(base,ci,p);};
      }
      endTimer=setTimeout(finish,700);
    };
    leaf.addEventListener('transitionend',function(e){if(e.target===leaf)finish();});
    base.addEventListener('load',function(e){if(e.target.tagName==='IMG'){clearTimeout(base._lt);base._lt=setTimeout(function(){counts[cur]=countOf(base);setPage(base,cur,Math.min(pg,counts[cur]-1));pg=Math.min(pg,counts[cur]-1);update();},150);}},true);
    var tx=null,ty=0,swiped=0;
    wrap.addEventListener('touchstart',function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
    wrap.addEventListener('touchend',function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){swiped=Date.now();turn(dx<0?1:-1);}},{passive:true});
    wrap.addEventListener('click',function(e){
      if(Date.now()-swiped<500)return;
      if(e.target.closest('a,button,input'))return;
      var sel=window.getSelection&&String(getSelection());if(sel)return;
      var r=stage.getBoundingClientRect();
      turn(e.clientX<r.left+r.width*0.33?-1:1);
    });
    var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(relayout,200);});
    onPrefs=function(){if(dims.ready)relayout();};
    nav={
      goTo:function(id){
        var el=d.getElementById(id);if(!el)return;var s=el.closest('section.ch');var ci=secs.indexOf(s);if(ci<0)return;
        closeAll();if(busy)finish();
        var p=0;if(el!==s){fill(base,ci);flowOf(base).style.transform='none';var t=base.querySelector('[id="'+id.replace(/"/g,'\\"')+'"]');if(t){if(t.classList.contains('pg')){var nx=t.nextElementSibling;if(nx&&nx.tagName==='FIGURE')p=pageOfEl(base,nx);else{t.style.display='inline-block';p=pageOfEl(base,t);t.style.display='';}}else p=pageOfEl(base,t);}}
        jump(ci,p);
      },
      step:function(n){turn(n);},
      hit:function(si,off,len){
        clearMarks();closeAll();if(busy)finish();
        markIn(si,off,len);counts[si]=null;meas._ci=null;base._ci=null;front._ci=null;
        ensure(si);fill(base,si);flowOf(base).style.transform='none';
        var m=base.querySelector('mark.rb-m');jump(si,m?pageOfEl(base,m):0);
      },
      init:function(){
        layout();dims.ready=true;
        var ci=Math.max(0,Math.min(secs.length-1,st.ch|0));cur=ci;
        var n=ensure(ci);jump(ci,Math.min(n-1,Math.round((st.pf||0)*n)));bg();
        if(d.fonts&&d.fonts.ready)d.fonts.ready.then(function(){relayout();});
      }
    };
  }

  /* ---------- 搜尋 ---------- */
  var q=d.getElementById('rb-q'),res=d.getElementById('rb-res'),qt;
  function runSearch(){
    var term=q.value.trim();res.textContent='';if(!term)return;
    var low=term.toLowerCase(),n=0,frag=d.createDocumentFragment();
    for(var i=0;i<secs.length&&n<200;i++){
      var txt=secs[i].textContent,L=txt.toLowerCase(),from=0;
      while(n<200){var at=L.indexOf(low,from);if(at<0)break;
        var b=d.createElement('button');b.type='button';b.className='rb-hit';b.setAttribute('data-s',i);b.setAttribute('data-o',at);b.setAttribute('data-l',term.length);
        var sm=d.createElement('small');sm.textContent=secs[i].getAttribute('data-title')||'';
        var sn=d.createElement('span');var s0=Math.max(0,at-24);
        sn.appendChild(d.createTextNode((s0>0?'…':'')+txt.slice(s0,at).replace(/\s+/g,' ')));
        var mkk=d.createElement('mark');mkk.textContent=txt.substr(at,term.length);sn.appendChild(mkk);
        sn.appendChild(d.createTextNode(txt.slice(at+term.length,at+term.length+40).replace(/\s+/g,' ')+'…'));
        b.appendChild(sm);b.appendChild(sn);frag.appendChild(b);n++;from=at+low.length;}
    }
    var c=d.createElement('p');c.className='rb-count';c.textContent=n?('找到 '+n+(n>=200?'+':'')+' 處'):('沒有找到「'+term+'」');
    res.appendChild(c);res.appendChild(frag);
  }
  if(q)q.addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(runSearch,250);});

  /* ---------- 共用事件 ---------- */
  d.addEventListener('click',function(e){
    var t=e.target.closest('button[data-open],[data-close],button[data-set],button[data-fs],button[data-go],.rb-hit,a[href^="#"]');if(!t)return;
    if(t.hasAttribute('data-open')){var p=d.getElementById(t.getAttribute('data-open'));if(p&&!p.hidden)closeAll();else openP(t.getAttribute('data-open'));return;}
    if(t.hasAttribute('data-close')){closeAll();return;}
    if(t.hasAttribute('data-set')){var kv=t.getAttribute('data-set').split(':');st[kv[0]]=kv[1];save();applyPrefs();return;}
    if(t.hasAttribute('data-fs')){st.fs=Math.max(13,Math.min(32,(+get('fs'))+(+t.getAttribute('data-fs'))));save();applyPrefs();return;}
    if(t.hasAttribute('data-go')){nav.step(+t.getAttribute('data-go'));return;}
    if(t.classList.contains('rb-hit')){nav.hit(+t.getAttribute('data-s'),+t.getAttribute('data-o'),+t.getAttribute('data-l'));return;}
    var id=decodeURIComponent(t.getAttribute('href').slice(1));if(id){e.preventDefault();nav.goTo(id);}
  });
  d.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeAll();return;}
    var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
    if(book){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();nav.step(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();nav.step(-1);}return;}
    if(!paged)return;if(e.key==='ArrowRight')nav.step(1);else if(e.key==='ArrowLeft')nav.step(-1);
  });
  applyPrefs();
  nav.init();
  var h='';try{h=decodeURIComponent(location.hash.slice(1));}catch(e){}
  if(h&&d.getElementById(h))nav.goTo(h);
})();</script>
